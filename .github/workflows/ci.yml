name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  schedule: 
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  nightly: nightly
  stable: stable

jobs:
  # Check formatting (platform-independent, one OS is enough).
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  # Verify the declared MSRV in Cargo.toml still builds.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    env:
      # MSRV-era compilers may emit warnings stable doesn't; don't deny them.
      RUSTFLAGS: ""
    steps:
    - uses: actions/checkout@v7
    - name: Read MSRV from Cargo.toml
      id: msrv
      run: |
        ver=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
        echo "version=$ver" >> "$GITHUB_OUTPUT"
    - name: Install MSRV toolchain (${{ steps.msrv.outputs.version }})
      run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
    - name: cargo +MSRV check --all-features
      run: cargo +${{ steps.msrv.outputs.version }} check --all-features

  # Apply clippy lints across the feature powerset.
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy --each-feature --all-targets

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack
    - name: Run build
      run: cargo hack build --feature-powerset

  test:
    name: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack
    - name: Run test
      run: cargo hack test --feature-powerset

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - msrv
      - clippy
      - build
      - test
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install LLVM tools
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        # Pin the llvm-cov version so CI and local runs generate the same
        # Cobertura report.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Cache cargo registry
        # Intentionally do NOT cache `target/`. cargo-llvm-cov manages its
        # instrumented artifacts separately from normal build artifacts.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-coverage-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-registry-
      - name: Print rustc / llvm-cov versions
        run: |
          rustc --version
          cargo llvm-cov --version
      - name: Run llvm-cov
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --all-features --workspace --lib --tests
          cargo llvm-cov --no-report --all-features --workspace --doctests
          cargo llvm-cov report --doctests --cobertura --output-path cobertura.xml
      - name: Upload coverage report artifact
        # Lets us download the exact cobertura.xml the CI produced and
        # compare it against a local llvm-cov run.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-xml
          path: cobertura.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
